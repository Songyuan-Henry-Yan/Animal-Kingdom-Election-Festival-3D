<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A cozy, nonpartisan civics game: same voters, same ballots, different voting rules." />
    <meta name="theme-color" content="#fcd7a7" />
    <title>Animal Kingdom Election Festival 3D</title>
    <style>
      /* Shown instantly while the game downloads; React replaces it on first render. */
      .boot {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(#8fb9e2, #fcd7a7 62%, #f2c290);
        font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
        color: #4a3218;
      }
      .boot-card {
        text-align: center;
        background: rgba(253, 246, 227, 0.92);
        border: 3px solid #8a5a2b;
        border-radius: 20px;
        padding: 22px 34px;
        box-shadow: 0 6px 0 rgba(74, 50, 24, 0.35);
      }
      .boot-emoji { font-size: 54px; line-height: 1; animation: boot-bob 1.6s ease-in-out infinite; }
      .boot-title { font-size: 22px; font-weight: 800; margin-top: 8px; }
      .boot-sub { font-size: 16px; opacity: 0.8; margin-top: 4px; }
      .boot-dots span {
        display: inline-block; width: 9px; height: 9px; margin: 10px 4px 0;
        border-radius: 50%; background: #4f9e56;
        animation: boot-dot 1.2s ease-in-out infinite;
      }
      .boot-dots span:nth-child(2) { animation-delay: 0.2s; }
      .boot-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes boot-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes boot-dot { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-emoji, .boot-dots span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-card">
          <div class="boot-emoji" aria-hidden="true">🌳</div>
          <div class="boot-title">Animal Kingdom Election Festival</div>
          <div class="boot-sub">Growing the forest…</div>
          <div class="boot-dots" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>
    <div id="print-root" aria-hidden="true"></div>
    <noscript>This game needs JavaScript to run. Please enable JavaScript and reload.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
